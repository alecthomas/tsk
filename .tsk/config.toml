imports = [
  "github.com/alecthomas/tsk@master//linters",
]

# Lint with the linters in this commit rather than a published version.
replace = { "github.com/alecthomas/tsk//linters" = "../linters" }

# Settings below mirror .golangci.yml.

disable = ["cyclop"]

skip-tests = ["bodyclose", "dupl", "errcheck", "funlen", "goconst", "godot", "noctx", "wrapcheck"]

[errcheck]
check-blank = true

[exhaustive]
check = ["switch", "map"]

[funcorder]
struct-method = false

[funlen]
lines = 250
statements = 50

[godoclint]
enable = ["no-unused-link"]

# golangci-lint excludes the one local replacement, of the TypeScript shim.
[gomoddirectives]
replace-local = true

# golangci-lint excludes godot findings on lines with TODO.
[godot]
exclude = ["TODO"]

[forbidigo]
analyze-types = true
forbid = [
  { pattern = '^fmt\.Errorf$', pkg = '^fmt$', msg = "Use github.com/alecthomas/errors.Errorf instead" },
  { pattern = "", pkg = '^errors$', msg = "Use github.com/alecthomas/errors instead" },
  { pattern = '\.MustGet$', pkg = '^github\.com/alecthomas/types/optional$', msg = "Use Get or Default and handle the absent case instead of MustGet" },
]

[perfsprint]
strconcat = false

[reassign]
patterns = [".*"]

[rowserrcheck]
packages = ["github.com/jmoiron/sqlx"]

[usetesting]
os-temp-dir = true

[wrapcheck]
ignore-package-globs = ["github.com/alecthomas/errors"]
