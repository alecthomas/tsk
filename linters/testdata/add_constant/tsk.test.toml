[[case]]
name = "default"
packages = ["example.com/revive/add-constant/default"]

[[case]]
name = "options"
packages = ["example.com/revive/add-constant/options"]
[case.config]
max-lit-count = 2
allow-strs = ["\"\""]
allow-ints = ["0", "1", "2"]
allow-floats = ["0.0", "1.0"]
ignore-funcs = ["os\\.(CreateFile|WriteFile|Chmod|FindProcess)", "\\.Println", "ignoredFunc", "\\.Info"]
